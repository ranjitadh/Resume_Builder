<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container bg-white shadow rounded p-4">
        <h2 class="mb-4">Resume Builder</h2>
        <form method="POST">
            <div class="mb-3"><label>Name</label><input type="text" name="name" class="form-control" required></div>
            <div class="mb-3"><label>Email</label><input type="email" name="email" class="form-control" required></div>
            <div class="mb-3"><label>Phone</label><input type="text" name="phone" class="form-control" required></div>
            <div class="mb-3"><label>LinkedIn</label><input type="text" name="linkedin" class="form-control"></div>
            <div class="mb-3"><label>Professional Summary</label><textarea name="summary" rows="4" class="form-control" required></textarea></div>
            <div class="mb-3"><label>Technical Skills (one per line)</label><textarea name="skills" rows="4" class="form-control" required></textarea></div>
            <div class="mb-3"><label>Experience (one per line)</label><textarea name="experience" rows="4" class="form-control" required></textarea></div>
            <div class="mb-3"><label>Education (one per line)</label><textarea name="education" rows="4" class="form-control" required></textarea></div>
            <button type="submit" class="btn btn-primary">Generate PDF</button>
        </form>
    </div>
</body>
</html>
