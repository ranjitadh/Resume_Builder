<!DOCTYPE html>
<html>
<head>
    <title>Submitted Resumes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
    <div class="container">
        <h2>Submitted Resumes</h2>
        <a href="/" class="btn btn-sm btn-secondary mb-3">← Back to Form</a>
        <ul class="list-group">
            {% for resume in resumes %}
                <li class="list-group-item">
                    <strong>{{ resume.name }}</strong><br>
                    {{ resume.email }} | {{ resume.phone }}<br>
                    <small>{{ resume.linkedin }}</small>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
